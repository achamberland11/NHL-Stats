<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>NHL Players</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 2rem;
      background: #1a1a1aff;
      color: #f0f0f0;
    }

    #playersContainer {
      width : 100%;
    }

    table {
      border-collapse: collapse;
      min-width: 100%;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 0.5rem;
      text-align: left;
      width: fit-content;
    }

    tr th:first-child,
    tr td:first-child {
      max-width: fit-content;
    }

    th {
      background: #313131ff;
      color: #f0f0f0;
    }

    #Number {
    }

    #Joueurs {
    }

    #Link {
      display: none;
    }

    .value-high {
      color: #030303ff;
      background: #9cff9cff;
    }

    .value-low {
      color: #030303ff;
      background: #ff9c9cff;
    }
    <!-- @import url("style.css"); -->
  </style>
</head>

<body>
  <h1>Player Statistics</h1>

  <select id="positionFilter">
    <option value="All">All positions</option>
    <option value="F">Forward</option>
    <option value="C">Center (C)</option>
    <option value="LW">Left Wing (LW)</option>
    <option value="RW">Right Wing (RW)</option>
    <option value="D">Defence (D)</option>
    <option value="G">Goaler (G)</option>
  </select>

  <div id="playersContainer"></div>

  <script src="script.js" defer></script>
</body>

</html>
